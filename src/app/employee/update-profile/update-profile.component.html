<div class="update-profile-container">
    <mat-card class="profile-bio" *ngIf="false"> <!-- HIDDEN CAUSE NOT USED. -->
      <mat-card-title>Update Bio</mat-card-title>
      <mat-card-content>
        <form [formGroup]="bioForm" (ngSubmit)="onSubmitBio()">
          <mat-form-field appearance="fill">
            <mat-label>Bio</mat-label>
            <textarea matInput formControlName="bio" placeholder="Tell us about yourself"></textarea>
          </mat-form-field>
          <button mat-raised-button color="primary" type="submit">Save Bio</button>
        </form>
      </mat-card-content>
    </mat-card>
  
    <mat-card class="profile-contacts">
      <mat-card-title>Manage Emergency Contacts</mat-card-title>
      <mat-card-content>
        <table mat-table [dataSource]="contactsDataSource">
          <ng-container matColumnDef="fullName">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element">{{element.fullName}}</td>
          </ng-container>
  
          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef>Phone Number</th>
            <td mat-cell *matCellDef="let element">{{element.phone}}</td>
          </ng-container>
  
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button color="accent" (click)="openEditContactDialog(element)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmDeleteContact(element)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="contactColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: contactColumns;"></tr>
        </table>
        <button mat-raised-button color="primary" (click)="openEditContactDialog()">Add New Contact</button>
      </mat-card-content>
    </mat-card>
  
    <mat-card class="profile-address">
      <mat-card-title>Manage Addresses</mat-card-title>
      <mat-card-content>
        <table mat-table [dataSource]="addressesDataSource">
          <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef>Address</th>
            <td mat-cell *matCellDef="let element">{{element.address}}</td>
          </ng-container>
  
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button color="accent" (click)="openEditAddressDialog(element)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" [disabled]="true" (click)="confirmDeleteAddress(element)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="addressColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: addressColumns;"></tr>
        </table>
        <button mat-raised-button color="primary" (click)="openEditAddressDialog()" *ngIf="addressesDataSource.data.length == 0">Add New Address</button>
      </mat-card-content>
    </mat-card>
  
    <mat-card class="profile-phone">
      <mat-card-title>Manage Phone Numbers</mat-card-title>
      <mat-card-content>
        <table mat-table [dataSource]="phoneNumbersDataSource">
          <ng-container matColumnDef="phoneNumber">
            <th mat-header-cell *matHeaderCellDef>Phone Number</th>
            <td mat-cell *matCellDef="let element">{{element.phoneNumber}}</td>
          </ng-container>
  
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button color="accent" (click)="openEditPhoneNumberDialog(element)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmDeletePhoneNumber(element)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="phoneColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: phoneColumns;"></tr>
        </table>
        <button mat-raised-button color="primary" (click)="openEditPhoneNumberDialog()">Add New Phone Number</button>
      </mat-card-content>
    </mat-card>
  </div>
